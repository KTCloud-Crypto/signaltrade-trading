name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: docker build -t signaltrade-trading:ci .
      - name: Smoke test container health
        run: |
          docker run -d --name signaltrade-trading-ci -p 8000:8000 \
            -e ENVIRONMENT=test -e DATABASE_URL=sqlite:// signaltrade-trading:ci
          trap 'docker logs signaltrade-trading-ci; docker rm -f signaltrade-trading-ci' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signaltrade
          POSTGRES_PASSWORD: signaltrade
          POSTGRES_DB: signaltrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signaltrade -d signaltrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://signaltrade:signaltrade@127.0.0.1:5432/signaltrade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests against PostgreSQL
        run: pytest -q

  publish-staging-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [test-and-build, postgres-integration]
    runs-on: ubuntu-latest
    environment: staging
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "arn:aws:iam::832496385575:role/signaltrade-staging-github-trading-ecr", aws-region: us-east-1}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: "832496385575.dkr.ecr.us-east-1.amazonaws.com/signaltrade/trading:${{ github.sha }}"}
